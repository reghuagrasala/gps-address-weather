<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050505"><title>Weather — My Location Info</title><link rel="stylesheet" href="../css/gps.css"></head><body><main class="gpsPage"><header class="appHead"><a class="back" href="../index.html">‹</a><div><div class="appName">My Location Info</div><div class="pageName">WEATHER</div></div><button class="menu" type="button">⋮</button></header><section class="scrollArea"><section class="dataCard two"><div><label>Position</label><strong id="coords">—</strong></div><div><label>Weather Status</label><strong><i></i>Waiting</strong></div></section><section class="dataCard two"><div><label>Temperature</label><strong id="temp">—</strong></div><div><label>Feels Like</label><strong id="feels">—</strong></div></section><section class="dataCard two"><div><label>Condition</label><strong id="condition">Waiting…</strong></div><div><label>Humidity</label><strong id="humidity">—</strong></div></section><section class="dataCard two"><div><label>Wind</label><strong id="wind">—</strong></div><div><label>Wind Direction</label><strong id="windDir">—</strong></div></section><section class="dataCard"><label>Weather Source</label><strong id="weatherStatus">Waiting for GPS…</strong><small>OPEN-METEO FALLBACK • NO API KEY</small></section></section><nav class="bottomNav"><a href="position.html" data-tab="position">⌖<span>Position</span></a><a href="gps.html" data-tab="gps">◈<span>GPS Data</span></a><a href="address.html" data-tab="address">⌑<span>Address</span></a><a class="active" href="weather.html" data-tab="weather">☁<span>Weather</span></a></nav></main><script src="../js/gps-engine.js"></script><script src="../js/fallback-services.js"></script><script>(function(){addEventListener("gpsfix",e=>{const c=e.detail||{};if(Number.isFinite(c.latitude)&&Number.isFinite(c.longitude)){document.getElementById("coords").textContent=c.latitude.toFixed(4)+"°, "+c.longitude.toFixed(4)+"°";window.MLIFallback?.weather(c.latitude,c.longitude,(s,d)=>{document.getElementById("weatherStatus").textContent=s;if(typeof d==="string"){document.getElementById("condition").textContent=d;return}document.getElementById("temp").textContent=Number.isFinite(d.temperature)?d.temperature.toFixed(1)+" °C":"—";document.getElementById("feels").textContent=Number.isFinite(d.feels)?d.feels.toFixed(1)+" °C":"—";document.getElementById("condition").textContent=d.description||"—";document.getElementById("humidity").textContent=Number.isFinite(d.humidity)?Math.round(d.humidity)+" %":"—";document.getElementById("wind").textContent=Number.isFinite(d.wind)?d.wind.toFixed(1)+" km/h":"—";document.getElementById("windDir").textContent=Number.isFinite(d.windDirection)?Math.round(d.windDirection)+"°":"—"})}});addEventListener("pageshow",()=>window.MyLocationGPS?.start())})();</script><script src="../js/tab-descriptions.js"></script></body></html>
