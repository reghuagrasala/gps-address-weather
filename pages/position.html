<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050505"><title>Position — My Location Info</title><link rel="stylesheet" href="../css/gps.css"></head><body><main class="gpsPage"><header class="appHead"><a class="back" href="../index.html">‹</a><div><div class="appName">My Location Info</div><div class="pageName">POSITION</div></div><button class="menu" type="button">⋮</button></header><section class="scrollArea">
<section class="dataCard two"><div><label>Position Source</label><strong>Device Location</strong></div><div><label>Fix Status</label><strong id="gpsStatus"><i></i>Active</strong></div></section>
<section class="dataCard two"><div><label>Latitude</label><strong id="latitude">—</strong><small>WGS84</small></div><div><label>Longitude</label><strong id="longitude">—</strong><small>WGS84</small></div></section>
<section class="dataCard two"><div><label>Accuracy</label><strong id="accuracy">—</strong><small>HORIZONTAL</small></div><div><label>Altitude</label><strong id="altitude">—</strong><small>ABOVE SEA LEVEL</small></div></section>
<section class="dataCard two"><div><label>Speed</label><strong id="speed">—</strong></div><div><label>Heading</label><strong id="heading">—</strong></div></section>
<section class="dataCard two headingCard" id="headingCard" role="button" tabindex="0"><div><label>Compass</label><strong id="compassState"><i></i>Tap to activate</strong></div><div><label>Movement</label><strong id="movement">Stationary</strong></div></section>
<div id="miniCompassFrame" class="miniCompassFrame compactCompass" hidden><div class="miniCompass"><span class="n">N</span><span class="e">E</span><span class="s">S</span><span class="w">W</span><div class="needle" aria-hidden="true"></div><div class="center">•</div></div></div>
<section class="dataCard two"><div><label>DMS Latitude</label><strong id="dmsLat">—</strong></div><div><label>DMS Longitude</label><strong id="dmsLon">—</strong></div></section>
<section class="dataCard two"><div><label>DIGIPIN</label><strong id="digipin">—</strong><small>INDIA POST</small></div><div><label>Plus Code</label><strong id="plusCode">—</strong><small>OPEN LOCATION CODE</small></div></section>
<section class="dataCard two"><div><label>Local Time</label><strong id="time">—</strong></div><div><label>Date</label><strong id="date">—</strong></div></section>
<section class="dataCard two"><div><label>Time Zone</label><strong id="zone">—</strong></div><div><label>Coordinate System</label><strong>WGS84</strong></div></section>
<section class="offlineBanner"><i>✓</i><span>Position data continues to work offline.</span></section>
</section><nav class="bottomNav"><a class="active" href="position.html" data-tab="position">⌖<span>Position</span></a><a href="gps.html" data-tab="gps">◈<span>GPS Data</span></a><a href="address.html" data-tab="address">⌑<span>Address</span></a><a href="weather.html" data-tab="weather">☁<span>Weather</span></a></nav></main>
<script src="../js/gps-engine.js"></script><script src="../js/location-formats.js"></script><script src="../js/compass.js"></script><script>
(function(){
const $=id=>document.getElementById(id),f=window.LocationFormats;
let last=null;
function update(c){if(!c)return;last=c;$("latitude").textContent=Number.isFinite(c.latitude)?c.latitude.toFixed(6)+"°":"—";$("longitude").textContent=Number.isFinite(c.longitude)?c.longitude.toFixed(6)+"°":"—";$("accuracy").textContent=Number.isFinite(c.accuracy)?"±"+Math.round(c.accuracy)+" m":"—";$("altitude").textContent=Number.isFinite(c.altitude)?Math.round(c.altitude)+" m":"—";$("speed").textContent=Number.isFinite(c.speed)&&c.speed>=0?(c.speed*3.6).toFixed(1)+" km/h":"0.0 km/h";$("heading").textContent=Number.isFinite(c.heading)&&c.heading>=0?f.bearing(c.heading):"—";$("dmsLat").textContent=f.dms(c.latitude,true);$("dmsLon").textContent=f.dms(c.longitude,false);$("digipin").textContent=f.digipin(c.latitude,c.longitude);$("plusCode").textContent=f.plusCode(c.latitude,c.longitude);$("movement").textContent=Number.isFinite(c.speed)&&c.speed>.5?"Moving":"Stationary";$("gpsStatus").innerHTML="<i></i>"+(Number.isFinite(c.accuracy)&&c.accuracy>100?"Weak":"Active")}
addEventListener("gpsfix",e=>update(e.detail));
try{const x=JSON.parse(localStorage.getItem("myLocationInfo.gps")||"null");if(x)update({latitude:x.lat,longitude:x.lon,accuracy:x.accuracy,altitude:x.altitude,speed:x.speed,heading:x.heading})}catch(e){}
function clock(){const d=new Date();$("time").textContent=d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",second:"2-digit"});$("date").textContent=d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});$("zone").textContent=Intl.DateTimeFormat().resolvedOptions().timeZone||"Local"}clock();setInterval(clock,1000);
})();
</script><script src="../js/tab-descriptions.js"></script></body></html>
