<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050505"><title>GPS Data — My Location Info</title><link rel="stylesheet" href="../css/gps.css"></head><body><main class="gpsPage"><header class="appHead"><a class="back" href="../index.html">‹</a><div><div class="appName">My Location Info</div><div class="pageName">GPS DATA</div></div><button class="menu" type="button">⋮</button></header><section class="scrollArea"><section class="dataCard two"><div><label>GPS Status</label><strong id="gpsStateValue"><i></i>Active</strong></div><div><label>Location Fix</label><strong id="fixValue">Available</strong></div></section><section class="dataCard two"><div><label>Latitude</label><strong id="latitude">—</strong><small>WGS84</small></div><div><label>Longitude</label><strong id="longitude">—</strong><small>WGS84</small></div></section><section class="dataCard two"><div><label>DMS Latitude</label><strong id="dmsLat">—</strong></div><div><label>DMS Longitude</label><strong id="dmsLon">—</strong></div></section><section class="dataCard two"><div><label>DIGIPIN</label><strong id="digipin">—</strong><small>INDIA POST</small></div><div><label>Plus Code</label><strong id="plusCode">—</strong><small>OPEN LOCATION CODE</small></div></section><section class="dataCard three"><div><label>Speed</label><strong id="speed">—</strong></div><div><label>Altitude</label><strong id="altitude">—</strong></div><div><label>Accuracy</label><strong id="accuracy">—</strong></div></section><section class="dataCard two headingCard" id="headingCard" role="button" tabindex="0"><div><label>Heading</label><strong id="heading">—</strong></div><div><label>Compass</label><strong id="compassState"><i></i>Available</strong></div></section><div id="miniCompassFrame" class="miniCompassFrame" hidden><div class="miniCompass"><span class="n">N</span><span class="e">E</span><span class="s">S</span><span class="w">W</span><div class="center">•</div></div></div><section class="infoCard"><div><span>▦</span><label>Date</label><b id="date">—</b></div><div><span>◷</span><label>Time</label><b id="time">—</b></div><div><span>◎</span><label>Time Zone</label><b id="zone">—</b></div><div><span>▯</span><label>Device</label><b>Safari / iOS</b></div><div><span>●</span><label>Position Source</label><b>GPS</b></div><div><span>⌁</span><label>Location Mode</label><b>High Accuracy</b></div></section><section class="offlineBanner"><i>✓</i><span>GPS works offline.</span></section></section><nav class="bottomNav"><a href="position.html">⌖<span>Position</span></a><a class="active" href="gps.html">◈<span>GPS Data</span></a><a href="address.html">⌑<span>Address</span></a><a href="weather.html">☁<span>Weather</span></a><a href="../index.html">⚙<span>Settings</span></a></nav></main><script src="../js/gps-engine.js"></script><script src="../js/location-formats.js"></script><script>(function(){const $=id=>document.getElementById(id);function update(c){if(!c)return;const f=window.LocationFormats;$("latitude").textContent=Number.isFinite(c.latitude)?c.latitude.toFixed(6)+"°":"—";$("longitude").textContent=Number.isFinite(c.longitude)?c.longitude.toFixed(6)+"°":"—";$("dmsLat").textContent=f.dms(c.latitude,true);$("dmsLon").textContent=f.dms(c.longitude,false);$("digipin").textContent=f.digipin(c.latitude,c.longitude);$("plusCode").textContent=f.plusCode(c.latitude,c.longitude);$("heading").textContent=f.bearing(c.heading);$("accuracy").textContent=Number.isFinite(c.accuracy)?"±"+Math.round(c.accuracy)+" m":"—";$("altitude").textContent=Number.isFinite(c.altitude)?Math.round(c.altitude)+" m":"—";$("speed").textContent=Number.isFinite(c.speed)&&c.speed>=0?(c.speed*3.6).toFixed(1)+" km/h":"0.0 km/h";$("gpsStateValue").innerHTML="<i></i>"+(Number.isFinite(c.accuracy)&&c.accuracy>100?"Weak":"Active");}addEventListener("gpsfix",e=>update(e.detail));try{const x=JSON.parse(localStorage.getItem("myLocationInfo.gps")||"null");if(x)update({latitude:x.lat,longitude:x.lon,accuracy:x.accuracy,altitude:x.altitude,speed:x.speed,heading:x.heading});}catch(e){}function clock(){const d=new Date();$("date").textContent=d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});$("time").textContent=d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",second:"2-digit"});const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"Local",o=-d.getTimezoneOffset(),sg=o>=0?"+":"-",hh=String(Math.floor(Math.abs(o)/60)).padStart(2,"0"),mm=String(Math.abs(o)%60).padStart(2,"0");$("zone").textContent=tz+" (GMT "+sg+hh+":"+mm+")"}clock();setInterval(clock,1000);const card=$("headingCard"),frame=$("miniCompassFrame");function toggle(){frame.hidden=!frame.hidden}card.onclick=toggle;card.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle()}};addEventListener("pageshow",()=>window.MyLocationGPS?.start())})();</script></body></html>
