<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#062b40"><title>GPS Data — My Location Info</title><link rel="stylesheet" href="../css/gps.css"></head><body><main class="gpsPage">
<header class="appHead"><a class="back" href="../index.html">‹</a><div><div class="appName">My Location Info</div><div class="pageName">GPS Data</div></div><button class="menu" type="button">⋮</button></header>
<section class="scrollArea"><section class="gpsHero"><div class="satIcon">◈</div><div><h1>GPS Data</h1><p>Available Offline</p></div></section>
<section class="dataCard two"><div><label>GPS Status</label><strong id="gpsStateValue"><i></i> Active</strong></div><div><label>Location Fix</label><strong id="fixValue">Available</strong></div></section>
<section class="dataCard two"><div><label>Accuracy</label><strong id="accuracy">—</strong></div><div><label>Satellites (device)</label><strong>—</strong><small>Not available in Safari</small></div></section>
<section class="dataCard two"><div><label>Elevation</label><strong id="altitude">—</strong></div><div><label>Speed</label><strong id="speed">—</strong></div></section>
<section class="dataCard two headingCard" id="headingCard" role="button" tabindex="0"><div><label>Heading</label><strong id="heading">—</strong></div><div><label>Compass</label><strong class="available"><i></i> Available</strong></div></section>
<div id="miniCompassFrame" class="miniCompassFrame" hidden><div class="miniCompass"><span class="n">N</span><span class="e">E</span><span class="s">S</span><span class="w">W</span><div class="center">°</div></div></div>
<section class="infoCard"><div><span>▦</span><label>Date</label><b id="date">—</b></div><div><span>◷</span><label>Time</label><b id="time">—</b></div><div><span>◎</span><label>Time Zone</label><b id="zone">Asia/Kolkata (GMT +5:30)</b></div><div><span>▯</span><label>Device</label><b id="device">Safari / iOS</b></div><div><span>●</span><label>Position Source</label><b>GPS (Device)</b></div></section>
<section class="offlineBanner"><i>✓</i><span>GPS works offline. No internet required.</span></section>
</section><nav class="bottomNav"><a href="position.html">⌖<span>Position</span></a><a class="active" href="gps.html">◈<span>GPS Data</span></a><a href="address.html">⌑<span>Address</span></a><a href="weather.html">☁<span>Weather</span></a><a href="../index.html">⚙<span>Settings</span></a></nav>
</main><script src="../js/gps-engine.js"></script><script>
(function(){const $=id=>document.getElementById(id);function h(v){if(!Number.isFinite(v)||v<0)return"—";const d=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];return Math.round(v)+"° "+d[Math.round(v/22.5)%16]}addEventListener("gpsfix",e=>{const c=e.detail||{};$("heading").textContent=h(c.heading);$("accuracy").textContent=Number.isFinite(c.accuracy)?Math.round(c.accuracy)+" m":"—";$("altitude").textContent=Number.isFinite(c.altitude)?Math.round(c.altitude)+" m":"—";$("speed").textContent=Number.isFinite(c.speed)&&c.speed>=0?(c.speed*3.6).toFixed(1)+" km/h":"0.0 km/h";$("gpsStateValue").innerHTML="<i></i> "+(c.accuracy>100?"Weak":"Active");$("fixValue").textContent="Available"});function clock(){const d=new Date();$("date").textContent=d.toLocaleDateString("en-IN",{day:"2-digit",month:"long",year:"numeric"});$("time").textContent=d.toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit",second:"2-digit"});$("device").textContent="Safari / iOS";$("zone").textContent=Intl.DateTimeFormat().resolvedOptions().timeZone+" (GMT +5:30)"}setInterval(clock,1000);clock();const hc=$("headingCard"),mf=$("miniCompassFrame");function toggle(){mf.hidden=!mf.hidden}hc.onclick=toggle;hc.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle()}};addEventListener("pageshow",()=>window.MyLocationGPS?.start())})();</script></body></html>
