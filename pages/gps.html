<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>GPS Data — My Location Info</title><link rel="stylesheet" href="../css/gps.css"></head><body><main><div class="top"><a href="../index.html">‹ Home</a><h1>GPS Data</h1><div class="sub">Offline GPS engine</div></div><section class="status-controls">
<button class="status-btn gps on" id="gpsToggle" type="button"><span class="status-dot"></span><b id="gpsState">GPS ON</b></button>
<button class="status-btn data" id="dataToggle" type="button"><span class="status-dot"></span><b id="dataState">DATA ON</b></button>
</section>
<section class="status"><span class="dot"></span><b id="gpsStatus">READY</b><div class="message" id="gpsMessage">Tap GPS ON to start.</div></section><section class="grid"><div class="card"><div class="label">Latitude</div><div class="value" id="latitude">—</div></div><div class="card"><div class="label">Longitude</div><div class="value" id="longitude">—</div></div><div class="card"><div class="label">Accuracy</div><div class="value" id="accuracy">—</div></div><div class="card"><div class="label">Altitude</div><div class="value" id="altitude">—</div></div><div class="card"><div class="label">Speed</div><div class="value" id="speed">—</div></div><div class="card"><div class="label">Heading</div><div class="value" id="heading">—</div></div></section><button id="requestGPS">REQUEST GPS</button><div class="note">GPS coordinates come directly from the iPhone browser Geolocation API. Address, weather and maps are not involved.</div></main><script src="../js/gps-engine.js"></script><script>
window.addEventListener("pageshow",()=>window.MyLocationGPS?.start());
document.getElementById("gpsToggle").onclick=()=>window.MyLocationGPS?.toggle();
let dataOn=true;
const db=document.getElementById("dataToggle");
function dataRender(){db.classList.toggle("on",dataOn);db.classList.toggle("off",!dataOn);db.querySelector("b").textContent=dataOn?"DATA ON":"DATA OFF"}
db.onclick=()=>{dataOn=!dataOn;dataRender()};dataRender();
</script></body></html>
