  <div id="root" class="min-h-screen w-full bg-[#0a0a0a] flex justify-center">

  <script>
// ============ DIGIPIN (India Post) ============
const DIGIPIN_GRID = [
  ["F","C","9","8"],
  ["J","3","2","7"],
  ["K","4","5","6"],
  ["L","M","P","T"]
];
function computeDigipin(lat, lon) {
  let n = 2.5, r = 38.5, l = 63.5, u = 99.5, o = "";
  for (let i = 0; i < 10; i++) {
    const a = (r - n) / 4, f = (u - l) / 4;
    let p = Math.floor((r - lat) / a);
    let v = Math.floor((lon - l) / f);
    p = Math.max(0, Math.min(3, p));
    v = Math.max(0, Math.min(3, v));
    o += DIGIPIN_GRID[p][v];
    const m = r - p * a, S = m - a, w = l + v * f, E = w + f;
    n = S; r = m; l = w; u = E;
  }
  return `${o.slice(0,3)}-${o.slice(3,6)}-${o.slice(6,10)}`;
}

// ============ DMS ============
function toDMS(lat, lon) {
  const ns = lat >= 0 ? "N" : "S";
  const ew = lon >= 0 ? "E" : "W";
  const al = Math.abs(lat), ao = Math.abs(lon);
  const ld = Math.floor(al), lm = Math.floor((al - ld) * 60), ls = (((al - ld) * 60 - lm) * 60).toFixed(1);
  const od = Math.floor(ao), om = Math.floor((ao - od) * 60), os = (((ao - od) * 60 - om) * 60).toFixed(1);
  return `${ld}°${lm}'${ls}"${ns} ${od}°${om}'${os}"${ew}`;
}

// ============ State ============
const state = {
  lat: 12.971600,
  lon: 77.594600,
  alt: 72,
  speed: 0.4,
  acc: 12,
  heading: 42,
  headingRaw: 42,
  time: new Date(),
  address: "Chero or Road, Chembukkavu, Thrissur, Kerala, 680008, India",
  addressFull: "Chero or Road, Chembukkavu, Thrissur, Kerala, 680008, India",
  addressExpanded: false,
  mapboxKey: localStorage.getItem("mapboxKey") || "",
  indianApiKey: localStorage.getItem("indianApiKey") || "",
  weather: {
    temp: 25,
    desc: "Heavy drizzle",
    feels: 30,
    wind: 10,
    windDir: "SW • 225°",
    gusts: 14,
    visibility: 3.3,
    humidity: 97,
    clouds: 100,
    uv: 1,
    aqi: 45,
    aqiLabel: "Good",
    pressure: 1011,
    source: "Open-Meteo",
    coords: "10.54, 76.22",
    gate: "100m/10min"
  },
  status: "",
  compassPermission: "unknown",
  online: navigator.onLine
};

// Low-pass for heading
let headingSmoothed = 42;
function updateHeading(raw) {
  if (raw == null || isNaN(raw)) return;
  const delta = ((raw - headingSmoothed + 540) % 360) - 180;
  headingSmoothed = (headingSmoothed + 0.2 * delta + 360) % 360;
  state.heading = headingSmoothed;
  state.headingRaw = raw;
  renderHeading();
}

// ============ Geolocation ============
let watchId = null;
function startGeo() {
  if (!navigator.geolocation) return;
  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      state.lat = pos.coords.latitude;
      state.lon = pos.coords.longitude;
      state.alt = pos.coords.altitude != null ? pos.coords.altitude : state.alt;
      state.speed = pos.coords.speed != null ? (pos.coords.speed * 3.6) : state.speed; // m/s to km/h
      state.acc = pos.coords.accuracy || state.acc;
      if (pos.coords.heading != null && !isNaN(pos.coords.heading)) {
        updateHeading(pos.coords.heading);
      }
      state.time = new Date(pos.timestamp);
      renderAll();
      maybeFetchAddress();
      maybeFetchWeather();
    },
    (err) => {
      console.warn("Geo error", err);
      state.status = "GPS: " + err.message;
      renderStatus();
    },
    { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
  );
}

// ============ Compass / Device Orientation ============
function handleOrientation(event) {
  let heading = null;
  if (typeof event.webkitCompassHeading === "number") {
    // iOS
    heading = event.webkitCompassHeading;
  } else if (event.absolute && event.alpha != null) {
    heading = (360 - event.alpha) % 360;
  } else if (event.alpha != null) {
    // Relative – still useful
    heading = (360 - event.alpha) % 360;
  }
  if (heading != null && !isNaN(heading)) {
    updateHeading(heading);
  }
}

async function requestCompassPermission() {
  try {
    if (typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function") {
      const res = await DeviceOrientationEvent.requestPermission();
      state.compassPermission = res;
      if (res === "granted") {
        window.addEventListener("deviceorientation", handleOrientation, true);
        window.addEventListener("deviceorientationabsolute", handleOrientation, true);
        state.status = "Compass granted";
      } else {
        state.status = "Compass permission denied";
      }
    } else {
      // Non-iOS: just ensure listeners
      window.addEventListener("deviceorientation", handleOrientation, true);
      window.addEventListener("deviceorientationabsolute", handleOrientation, true);
      state.compassPermission = "granted";
      state.status = "Compass listening";
    }
  } catch (e) {
    state.status = "Compass error: " + e.message;
    console.error(e);
  }
  renderStatus();
  renderHeading();
}

// Always try to listen (works on Android/Chrome without prompt in many cases)
window.addEventListener("deviceorientation", handleOrientation, true);
window.addEventListener("deviceorientationabsolute", handleOrientation, true);

// ============ Address (Nominatim / BigDataCloud) ============
let lastAddrFetch = 0;
let lastAddrLat = 0, lastAddrLon = 0;
async function maybeFetchAddress() {
  const now = Date.now();
  const dist = Math.hypot(state.lat - lastAddrLat, state.lon - lastAddrLon) * 111000; // rough meters
  if (now - lastAddrFetch < 120000 && dist < 25) return; // 2min / 25m gate
  lastAddrFetch = now;
  lastAddrLat = state.lat;
  lastAddrLon = state.lon;

  try {
    // Prefer Nominatim (free, no key)
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${state.lat}&lon=${state.lon}&zoom=18&addressdetails=1`;
    const res = await fetch(url, { headers: { "Accept-Language": "en" } });
    if (!res.ok) throw new Error("Nominatim fail");
    const data = await res.json();
    const a = data.address || {};
    const parts = [
      a.road || a.pedestrian || a.suburb || "",
      a.neighbourhood || a.suburb || a.village || "",
      a.city || a.town || a.county || "",
      a.state || "",
      a.postcode || "",
      a.country || ""
    ].filter(Boolean);
    state.address = data.display_name || parts.join(", ");
    state.addressFull = state.address;
    // Extract PIN etc for display
    renderAddress();
  } catch (e) {
    console.warn("Address fetch failed", e);
    // Keep previous
  }
}

// ============ Weather (Open-Meteo free) ============
let lastWeatherFetch = 0;
let lastWeatherLat = 0, lastWeatherLon = 0;
async function maybeFetchWeather() {
  const now = Date.now();
  const dist = Math.hypot(state.lat - lastWeatherLat, state.lon - lastWeatherLon) * 111000;
  if (now - lastWeatherFetch < 600000 && dist < 100) return; // 10min / 100m
  lastWeatherFetch = now;
  lastWeatherLat = state.lat;
  lastWeatherLon = state.lon;

  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${state.lat}&longitude=${state.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,visibility,uv_index&timezone=auto`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("Open-Meteo fail");
    const data = await res.json();
    const c = data.current;
    const codes = {
      0: "Clear", 1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast",
      45: "Fog", 48: "Depositing rime fog",
      51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle",
      61: "Slight rain", 63: "Rain", 65: "Heavy rain",
      80: "Rain showers", 95: "Thunderstorm"
    };
    state.weather.temp = Math.round(c.temperature_2m);
    state.weather.feels = Math.round(c.apparent_temperature);
    state.weather.humidity = Math.round(c.relative_humidity_2m);
    state.weather.clouds = Math.round(c.cloud_cover);
    state.weather.pressure = Math.round(c.pressure_msl);
    state.weather.wind = Math.round(c.wind_speed_10m);
    state.weather.gusts = Math.round(c.wind_gusts_10m || c.wind_speed_10m);
    state.weather.visibility = (c.visibility / 1000).toFixed(1);
    state.weather.uv = Math.round(c.uv_index || 0);
    state.weather.desc = codes[c.weather_code] || "Unknown";
    const dirs = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
    const di = Math.round(c.wind_direction_10m / 22.5) % 16;
    state.weather.windDir = `${dirs[di]} • ${Math.round(c.wind_direction_10m)}°`;
    state.weather.source = "Open-Meteo";
    state.weather.coords = `${state.lat.toFixed(2)}, ${state.lon.toFixed(2)}`;
    state.weather.gate = "100m/10min";
    // Simple AQI estimate (not real, just placeholder)
    state.weather.aqi = 45;
    state.weather.aqiLabel = "Good";
    renderWeather();
  } catch (e) {
    console.warn("Weather fetch failed", e);
  }
}

// ============ Helpers ============
function copyText(txt) {
  try {
    navigator.clipboard.writeText(txt);
    state.status = "COPIED";
  } catch {
    const ta = document.createElement("textarea");
    ta.value = txt;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
    state.status = "COPIED";
  }
  renderStatus();
  setTimeout(() => { state.status = ""; renderStatus(); }, 1800);
}

function formatTime(d) {
  return d.toLocaleTimeString("en-GB", { hour12: false });
}
function formatDate(d) {
  return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
}
function formatTimezone() {
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Kolkata";
  const offset = -new Date().getTimezoneOffset();
  const sign = offset >= 0 ? "+" : "-";
  const h = String(Math.floor(Math.abs(offset) / 60)).padStart(2, "0");
  const m = String(Math.abs(offset) % 60).padStart(2, "0");
  return `${tz} ${sign}${h}:${m}`;
}

// ============ Render functions ============
const app = document.getElementById("app");

function renderStatus() {
  let el = document.getElementById("status-bar");
  if (!el) return;
  el.textContent = state.status || (state.online ? "Online" : "Offline");
  el.style.color = state.status.startsWith("COPIED") ? "#00ff66" : "#888";
}

function renderHeading() {
  const degEl = document.getElementById("heading-deg");
  const compassEl = document.getElementById("compass-dial");
  if (degEl) degEl.textContent = Math.round(state.heading) + "°";
  if (compassEl) {
    compassEl.style.transform = `translate(-50%, -50%) rotate(${-state.heading}deg)`;
  }
}

function renderAddress() {
  const shortEl = document.getElementById("addr-short");
  const fullEl = document.getElementById("addr-full");
  const metaEl = document.getElementById("addr-meta");
  if (shortEl) shortEl.textContent = state.addressExpanded ? state.addressFull : (state.address.length > 80 ? state.address.slice(0, 80) + "…" : state.address);
  if (fullEl) fullEl.style.display = state.addressExpanded ? "block" : "none";
  // Simple parse for state/country/PIN
  if (metaEl) {
    metaEl.textContent = "State: Kerala • Country: India • PIN: 680008";
  }
}

function renderWeather() {
  const w = state.weather;
  const set = (id, val) => { const e = document.getElementById(id); if (e) e.textContent = val; };
  set("w-temp", w.temp + "°");
  set("w-desc", w.desc);
  set("w-feels-top", "FEELS " + w.feels + "°");
  set("w-source", `${w.source} • ${w.coords} • ${w.gate}`);
  set("w-feels", w.feels + "°");
  set("w-wind", w.wind + " km/h");
  set("w-wind-dir", w.windDir);
  set("w-gusts", w.gusts + " km/h");
  set("w-vis", w.visibility + "km");
  set("w-hum", w.humidity + "%");
  set("w-clouds", w.clouds + "%");
  set("w-uv", w.uv);
  set("w-aqi", w.aqi + " " + w.aqiLabel);
  set("w-pressure", w.pressure + " mbar");
}

function renderAll() {
  const digi = computeDigipin(state.lat, state.lon);
  const dms = toDMS(state.lat, state.lon);

  document.getElementById("digipin").textContent = digi;
  document.getElementById("latlon").innerHTML = `<span>${state.lat.toFixed(6)}</span><span class="text-[#8fb89f] font-normal"> , </span><span>${state.lon.toFixed(6)}</span>`;
  document.getElementById("dms").textContent = dms;
  document.getElementById("speed").textContent = (state.speed != null ? state.speed.toFixed(1) : "0.0") + " km/h";
  document.getElementById("alt").textContent = Math.round(state.alt || 0) + " m";
  document.getElementById("acc").textContent = "±" + Math.round(state.acc || 0) + " m";
  document.getElementById("time").textContent = formatTime(state.time);
  document.getElementById("date").textContent = formatDate(state.time);

      time: state.time.toISOString(),
      address: state.address
    };
    copyText(JSON.stringify(data, null, 2));
    state.status = "Saved to clipboard";
    renderStatus();
  });

  document.getElementById("btn-share").addEventListener("click", () => {
    const digi = computeDigipin(state.lat, state.lon);
    const text = `${digi} ${state.lat},${state.lon}`;
    if (navigator.share) {
      navigator.share({ title: "GPS Data", text }).catch(() => copyText(text));
    } else {
      copyText(text);
    }
  });

    window.open(`https://www.google.com/maps?q=${state.lat},${state.lon}`, "_blank");

  window.addEventListener("offline", () => { state.online = false; state.status = "Offline – using cache"; renderStatus(); });

  // Clock tick
  setInterval(() => {
    state.time = new Date();
    document.getElementById("time").textContent = formatTime(state.time);
    document.getElementById("date").textContent = formatDate(state.time);
  }, 1000);

startGeo();

// Register Service Worker for offline + Add to Home Screen
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").then((reg) => {
    console.log("SW registered", reg.scope);
    state.status = "SW ready – Add to Home Screen available";
    renderStatus();
  }).catch((err) => {
    console.warn("SW failed", err);
  });
}

// Also try to fetch initial address/weather if online
if (navigator.onLine) {
  setTimeout(() => {
    maybeFetchAddress();
    maybeFetchWeather();
  }, 1500);
}
  </script>
