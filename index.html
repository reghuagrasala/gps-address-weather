<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>My Location Info — GPS Test</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:#0b1220;color:#fff}body{padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);display:flex;justify-content:center}main{width:min(520px,100%);padding:28px 0}h1{font-size:27px;margin:0 0 6px}.sub{opacity:.65;margin-bottom:24px}.status{padding:18px;border-radius:18px;background:#16233a;border:1px solid #263957;margin-bottom:16px}.status b{font-size:20px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#f2b84b;margin-right:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{padding:16px;border-radius:16px;background:#121d31;border:1px solid #22334f}.label{font-size:12px;opacity:.55;text-transform:uppercase}.value{font-size:19px;font-weight:600;margin-top:7px;word-break:break-word}button{width:100%;margin-top:18px;padding:16px;border:0;border-radius:16px;background:#fff;color:#0b1220;font-size:17px;font-weight:700}.note{margin-top:18px;font-size:13px;line-height:1.5;opacity:.6}</style></head><body><main><h1>My Location Info</h1><div class="sub">GPS engine test — no address or weather services</div><div class="status"><span class="dot" id="dot"></span><b id="status">READY</b><div id="message" class="note">Tap Request GPS to use iPhone Location Services.</div></div><div class="grid"><div class="card"><div class="label">Latitude</div><div class="value" id="lat">—</div></div><div class="card"><div class="label">Longitude</div><div class="value" id="lon">—</div></div><div class="card"><div class="label">Accuracy</div><div class="value" id="acc">—</div></div><div class="card"><div class="label">Altitude</div><div class="value" id="alt">—</div></div><div class="card"><div class="label">Speed</div><div class="value" id="speed">—</div></div><div class="card"><div class="label">Heading</div><div class="value" id="heading">—</div></div></div><button id="request">REQUEST GPS</button><div class="note">Browser Geolocation only. No address, weather, map or network API is used to obtain coordinates.</div></main><script>(function(){const $=id=>document.getElementById(id);let watch=null;function state(t,m,good){$("status").textContent=t;$("message").textContent=m;$("dot").style.background=good?"#36d27a":"#f2b84b"}function fix(p){const c=p.coords;if(!c)return;$("lat").textContent=c.latitude.toFixed(6)+"°";$("lon").textContent=c.longitude.toFixed(6)+"°";$("acc").textContent=Number.isFinite(c.accuracy)?Math.round(c.accuracy)+" m":"—";$("alt").textContent=Number.isFinite(c.altitude)?Math.round(c.altitude)+" m":"—";$("speed").textContent=Number.isFinite(c.speed)&&c.speed>=0?(c.speed*3.6).toFixed(1)+" km/h":"0.0 km/h";$("heading").textContent=Number.isFinite(c.heading)&&c.heading>=0?Math.round(c.heading)+"°":"—";localStorage.setItem("simpleGpsFix",JSON.stringify({lat:c.latitude,lon:c.longitude,acc:c.accuracy,alt:c.altitude,speed:c.speed,heading:c.heading,time:p.timestamp}));state(navigator.onLine?"GPS ACTIVE":"GPS ACTIVE — OFFLINE","iPhone supplied a location fix.",true)}function error(e){const m=e.code===1?"Location permission was denied. Check Safari website Location permission and Precise Location.":e.code===2?"Location is temporarily unavailable. Try outdoors or near a window.":e.code===3?"GPS timed out. The page will try again.":"Unable to obtain location.";state(e.code===1?"PERMISSION DENIED":"WAITING FOR GPS",m,false);if(e.code!==1)setTimeout(start,3000)}function start(){if(!navigator.geolocation){error({code:2});return}if(watch!==null)navigator.geolocation.clearWatch(watch);state("SEARCHING","Requesting iPhone Location Services…",false);navigator.geolocation.getCurrentPosition(fix,error,{enableHighAccuracy:true,maximumAge:0,timeout:20000});watch=navigator.geolocation.watchPosition(fix,error,{enableHighAccuracy:true,maximumAge:2000,timeout:20000})}$("request").onclick=start;try{const x=JSON.parse(localStorage.getItem("simpleGpsFix")||"null");if(x){$("lat").textContent=x.lat.toFixed(6)+"°";$("lon").textContent=x.lon.toFixed(6)+"°";$("acc").textContent=Math.round(x.acc)+" m";$("alt").textContent=Number.isFinite(x.alt)?Math.round(x.alt)+" m":"—";$("speed").textContent=Number.isFinite(x.speed)?(x.speed*3.6).toFixed(1)+" km/h":"0.0 km/h";$("heading").textContent=Number.isFinite(x.heading)&&x.heading>=0?Math.round(x.heading)+"°":"—"}}catch(e){}if(location.protocol!=="https:"&&location.hostname!=="localhost")state("HTTPS REQUIRED","Geolocation requires a secure HTTPS page.",false)})();</script></body></html>
